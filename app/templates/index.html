<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess AI</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    /* ── Design tokens ───────────────────────────────────────── */
    :root {
      --bg:             #0d0d14;
      --surface:        rgba(255,255,255,0.06);
      --surface-hover:  rgba(255,255,255,0.09);
      --border:         rgba(255,255,255,0.10);
      --border-strong:  rgba(255,255,255,0.18);
      --accent-green:   #22c55e;
      --accent-blue:    #3b82f6;
      --accent-amber:   #f59e0b;
      --accent-red:     #ef4444;
      --text-primary:   #f1f5f9;
      --text-muted:     #64748b;
      --radius-card:    20px;
      --radius-pill:    100px;
      --blur:           blur(16px);
    }

    /* ── Reset & base ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(59,130,246,0.12), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(99,102,241,0.08), transparent);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    /* ── Header ──────────────────────────────────────────────── */
    header {
      width: 100%;
      padding: 20px 20px 8px;
      text-align: center;
    }
    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
      letter-spacing: 0.3px;
    }

    /* ── Player cards ────────────────────────────────────────── */
    #players-wrap {
      width: min(96vw, 420px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 12px 0 8px;
    }

    .player-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      transition: border-color 0.35s ease, box-shadow 0.35s ease;
    }
    .player-card.is-active {
      border-color: var(--active-color, var(--accent-blue));
      box-shadow: 0 0 0 1px var(--active-color, var(--accent-blue)),
                  0 4px 20px rgba(0,0,0,0.35);
    }
    #card-white { --active-color: var(--accent-green); }
    #card-black { --active-color: var(--accent-amber); }

    .player-avatar {
      font-size: 1.6rem;
      line-height: 1;
      width: 36px;
      text-align: center;
    }
    .player-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .player-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .player-role {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 1px;
    }
    .player-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.35s ease;
      flex-shrink: 0;
    }
    .player-card.is-active .player-dot {
      background: var(--active-color, var(--accent-blue));
      animation: pulse-ring 1.6s ease-out infinite;
    }

    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 var(--active-color); }
      70%  { box-shadow: 0 0 0 6px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    /* ── Board wrapper ───────────────────────────────────────── */
    #board-wrap {
      width: min(96vw, 420px);
      aspect-ratio: 1;
      padding: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow:
        0 24px 48px rgba(0,0,0,0.55),
        0 0 0 1px rgba(255,255,255,0.03);
      position: relative;
    }

    #board {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
      overflow: hidden;
      touch-action: none;
    }

    /* ── Status pill ─────────────────────────────────────────── */
    #status {
      width: min(96vw, 420px);
      margin: 12px 0 4px;
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      min-height: 44px;
      transition: background 0.35s ease, border-color 0.35s ease, color 0.35s ease;
    }
    #status.your-turn  {
      color: var(--accent-blue);
      background: rgba(59,130,246,0.12);
      border-color: rgba(59,130,246,0.4);
    }
    #status.thinking   {
      color: var(--accent-amber);
      background: rgba(245,158,11,0.12);
      border-color: rgba(245,158,11,0.4);
    }
    #status.game-over  {
      color: var(--accent-red);
      background: rgba(239,68,68,0.12);
      border-color: rgba(239,68,68,0.4);
      font-weight: 700;
    }

    /* thinking dots */
    #thinking-dots { display: none; align-items: center; gap: 4px; }
    #status.thinking #thinking-dots { display: flex; }
    #status.thinking #status-text   { display: none; }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent-amber);
      animation: bounce-dot 0.6s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.30s; }

    @keyframes bounce-dot {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50%       { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Controls ────────────────────────────────────────────── */
    #controls {
      display: flex;
      gap: 12px;
      margin: 14px 0;
      width: min(96vw, 420px);
    }
    button {
      flex: 1;
      height: 52px;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      letter-spacing: 0.2px;
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.15s;
    }
    button:active { transform: scale(0.95); }
    #btn-new {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: #fff;
      box-shadow: 0 4px 20px rgba(34,197,94,0.30);
    }
    #btn-flip {
      background: var(--surface);
      border-color: var(--border-strong);
      color: var(--text-primary);
    }
    .btn-icon { font-size: 1.1rem; line-height: 1; }

    /* ── Move history ────────────────────────────────────────── */
    #history-wrap {
      width: min(96vw, 420px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      padding: 14px 16px 16px;
      margin-bottom: 24px;
      max-height: 190px;
      overflow-y: auto;
    }
    #history-wrap::-webkit-scrollbar { width: 3px; }
    #history-wrap::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 99px;
    }

    .history-header {
      display: grid;
      grid-template-columns: 28px 1fr 1fr;
      padding: 0 4px 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .history-header span {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }
    .history-header span:last-child { text-align: left; padding-left: 8px; }

    #move-list {
      display: grid;
      grid-template-columns: 28px 1fr 1fr;
      row-gap: 1px;
    }
    .move-row {
      display: contents;
    }
    .move-row > span {
      padding: 5px 4px;
      font-size: 0.82rem;
      font-family: 'Courier New', monospace;
      border-radius: 4px;
    }
    .move-row .mn {
      color: var(--text-muted);
      font-size: 0.75rem;
      display: flex;
      align-items: center;
    }
    .move-row .mw, .move-row .mb {
      color: var(--text-primary);
      font-weight: 500;
    }
    .move-row .mb { padding-left: 8px; }
    .move-row.latest .mw,
    .move-row.latest .mb { color: var(--accent-blue); }
  </style>
</head>
<body>

  <header>
    <h1>♟ Chess AI</h1>
    <p>You play White · AI plays Black</p>
  </header>

  <div id="players-wrap">
    <div class="player-card" id="card-black">
      <div class="player-avatar">🤖</div>
      <div class="player-info">
        <span class="player-name">AI</span>
        <span class="player-role">Black · Neural network</span>
      </div>
      <div class="player-dot"></div>
    </div>
    <div class="player-card is-active" id="card-white">
      <div class="player-avatar">🧑</div>
      <div class="player-info">
        <span class="player-name">You</span>
        <span class="player-role">White · Your move</span>
      </div>
      <div class="player-dot"></div>
    </div>
  </div>

  <div id="board-wrap">
    <svg id="board" viewBox="0 0 400 400"></svg>
  </div>

  <div id="status" class="your-turn">
    <span id="status-text">Your turn</span>
    <span id="thinking-dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </span>
  </div>

  <div id="controls">
    <button id="btn-new"><span class="btn-icon">✦</span> New Game</button>
    <button id="btn-flip"><span class="btn-icon">⇅</span> Flip Board</button>
  </div>

  <div id="history-wrap">
    <div class="history-header">
      <span>#</span><span>White</span><span style="padding-left:8px">Black</span>
    </div>
    <div id="move-list"></div>
  </div>

  <script>
    // ── Constants ──────────────────────────────────────────────
    const LIGHT = '#f0d9b5';
    const DARK  = '#b58863';
    const SEL   = 'rgba(20,  85, 30,  0.6)';
    const LEGAL = 'rgba(20,  85, 30,  0.35)';
    const LAST  = 'rgba(155, 199, 0,   0.41)';

    const GLYPHS = {
      wP:'♙', wN:'♘', wB:'♗', wR:'♖', wQ:'♕', wK:'♔',
      bP:'♟', bN:'♞', bB:'♝', bR:'♜', bQ:'♛', bK:'♚',
    };

    // ── State ──────────────────────────────────────────────────
    const game   = new Chess();
    let flipped  = false;
    let selected = null;
    let lastMove = null;
    let locked   = false;

    const svg         = document.getElementById('board');
    const statusEl    = document.getElementById('status');
    const statusText  = document.getElementById('status-text');
    const moveListEl  = document.getElementById('move-list');
    const cardWhite   = document.getElementById('card-white');
    const cardBlack   = document.getElementById('card-black');

    // ── Coordinate helpers ─────────────────────────────────────
    function squareToXY(sq) {
      const file = sq.charCodeAt(0) - 97;
      const rank = parseInt(sq[1]) - 1;
      const col  = flipped ? 7 - file : file;
      const row  = flipped ? rank : 7 - rank;
      return { x: col * 50, y: row * 50 };
    }

    function xyToSquare(px, py) {
      const col  = Math.floor(px / 50);
      const row  = Math.floor(py / 50);
      const file = flipped ? 7 - col : col;
      const rank = flipped ? row : 7 - row;
      if (file < 0 || file > 7 || rank < 0 || rank > 7) return null;
      return String.fromCharCode(97 + file) + (rank + 1);
    }

    // ── SVG helpers ────────────────────────────────────────────
    function svgEl(tag, attrs) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    // ── Draw ───────────────────────────────────────────────────
    function draw() {
      svg.innerHTML = '';

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const light = (row + col) % 2 === 0;
          svg.appendChild(svgEl('rect', {
            x: col * 50, y: row * 50, width: 50, height: 50,
            fill: light ? LIGHT : DARK,
          }));
        }
      }

      if (lastMove) {
        for (const sq of [lastMove.from, lastMove.to]) {
          const {x, y} = squareToXY(sq);
          svg.appendChild(svgEl('rect', { x, y, width: 50, height: 50, fill: LAST }));
        }
      }

      if (selected) {
        const {x, y} = squareToXY(selected);
        svg.appendChild(svgEl('rect', { x, y, width: 50, height: 50, fill: SEL }));

        const moves = game.moves({ square: selected, verbose: true });
        for (const m of moves) {
          const {x: mx, y: my} = squareToXY(m.to);
          const hasPiece = game.get(m.to);
          if (hasPiece) {
            svg.appendChild(svgEl('rect', { x: mx, y: my, width: 50, height: 50, fill: LEGAL }));
          } else {
            svg.appendChild(svgEl('circle', {
              cx: mx + 25, cy: my + 25, r: 10, fill: LEGAL,
            }));
          }
        }
      }

      for (let i = 0; i < 8; i++) {
        const rank = flipped ? i + 1 : 8 - i;
        const file = String.fromCharCode(97 + (flipped ? 7 - i : i));
        svg.appendChild(Object.assign(svgEl('text', {
          x: 2, y: i * 50 + 14, 'font-size': 11, fill: i % 2 === 0 ? DARK : LIGHT,
          'font-family': 'sans-serif', 'font-weight': 'bold',
        }), { textContent: rank }));
        svg.appendChild(Object.assign(svgEl('text', {
          x: i * 50 + 36, y: 398, 'font-size': 11, fill: i % 2 === 0 ? LIGHT : DARK,
          'font-family': 'sans-serif', 'font-weight': 'bold',
        }), { textContent: file }));
      }

      const board = game.board();
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const file  = flipped ? 7 - col : col;
          const rank  = flipped ? row : 7 - row;
          const piece = board[7 - rank][file];
          if (!piece) continue;
          const key   = piece.color + piece.type.toUpperCase();
          const glyph = GLYPHS[key];
          const text  = svgEl('text', {
            x: col * 50 + 25, y: row * 50 + 38,
            'text-anchor': 'middle',
            'font-size': 38,
            'font-family': 'serif',
            style: 'pointer-events:none; user-select:none;',
          });
          text.textContent = glyph;
          svg.appendChild(text);
        }
      }
    }

    // ── Status helper ──────────────────────────────────────────
    function setStatus(msg, cls) {
      statusText.textContent = msg;
      statusEl.className     = cls;

      // Update player card active state
      cardWhite.classList.toggle('is-active', cls === 'your-turn');
      cardBlack.classList.toggle('is-active', cls === 'thinking');
    }

    // ── Move history ───────────────────────────────────────────
    function updateHistory() {
      const history = game.history();
      moveListEl.innerHTML = '';
      for (let i = 0; i < history.length; i += 2) {
        const row = document.createElement('div');
        row.className = 'move-row' + (i >= history.length - 2 ? ' latest' : '');

        const num = document.createElement('span');
        num.className = 'mn';
        num.textContent = `${i / 2 + 1}.`;

        const white = document.createElement('span');
        white.className = 'mw';
        white.textContent = history[i];

        const black = document.createElement('span');
        black.className = 'mb';
        black.textContent = history[i + 1] || '';

        row.appendChild(num);
        row.appendChild(white);
        row.appendChild(black);
        moveListEl.appendChild(row);
      }
      moveListEl.scrollTop = moveListEl.scrollHeight;
    }

    // ── Handle tap/click on a square ──────────────────────────
    function handleSquare(sq) {
      if (locked || game.game_over()) return;
      if (game.turn() !== 'w') return;

      const piece = game.get(sq);

      if (selected) {
        const move = game.move({ from: selected, to: sq, promotion: 'q' });
        if (move) {
          lastMove = { from: selected, to: sq };
          selected = null;
          updateHistory();
          draw();
          if (game.game_over()) {
            setStatus(gameOverMessage(), 'game-over');
          } else {
            aiMove();
          }
          return;
        }
        if (piece && piece.color === 'w') {
          selected = sq;
          draw();
          return;
        }
        selected = null;
        draw();
        return;
      }

      if (piece && piece.color === 'w') {
        selected = sq;
        draw();
      }
    }

    // ── SVG click → square ────────────────────────────────────
    svg.addEventListener('click', e => {
      const rect  = svg.getBoundingClientRect();
      const scaleX = 400 / rect.width;
      const scaleY = 400 / rect.height;
      const px = (e.clientX - rect.left) * scaleX;
      const py = (e.clientY - rect.top)  * scaleY;
      const sq = xyToSquare(px, py);
      if (sq) handleSquare(sq);
    });

    // ── AI move via API ────────────────────────────────────────
    async function aiMove() {
      locked = true;
      setStatus('AI is thinking', 'thinking');

      try {
        const res = await fetch('/api/move', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fen: game.fen(), top_k: 1 }),
        });
        const data = await res.json();

        if (!res.ok) {
          setStatus('AI error: ' + (data.error || res.status), 'game-over');
          locked = false;
          return;
        }

        const move = game.move(data.move);
        if (move) {
          lastMove = { from: move.from, to: move.to };
          updateHistory();
        }
      } catch (err) {
        setStatus('Network error', 'game-over');
      }

      locked = false;
      draw();

      if (game.game_over()) {
        setStatus(gameOverMessage(), 'game-over');
      } else {
        setStatus('Your turn', 'your-turn');
      }
    }

    // ── Game-over message ──────────────────────────────────────
    function gameOverMessage() {
      if (game.in_checkmate()) return game.turn() === 'w' ? 'Checkmate — AI wins' : 'Checkmate — You win!';
      if (game.in_draw())     return 'Draw';
      if (game.in_stalemate()) return 'Stalemate';
      return 'Game over';
    }

    // ── Buttons ────────────────────────────────────────────────
    document.getElementById('btn-new').addEventListener('click', () => {
      game.reset();
      selected = null;
      lastMove = null;
      locked   = false;
      updateHistory();
      draw();
      setStatus('Your turn', 'your-turn');
    });

    document.getElementById('btn-flip').addEventListener('click', () => {
      flipped = !flipped;
      draw();
    });

    // ── Init ───────────────────────────────────────────────────
    draw();
    setStatus('Your turn', 'your-turn');
  </script>

</body>
</html>
